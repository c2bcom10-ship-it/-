# Codex 설정 예시
# 이 내용을 내 컴퓨터의 Codex 설정 파일에 붙여넣으세요.
#   Windows: C:\Users\내이름\.codex\config.toml
#   Mac:     ~/.codex/config.toml
# (파일이 없으면 새로 만들면 돼요)
# ⚠️ [대괄호]로 시작하는 줄보다 위에 있는 줄들은 순서를 지켜 맨 위에 두세요.

# ── 1. 승인창 줄이기 ─────────────────────────────
# "on-request" : Codex가 꼭 필요할 때만 물어봐요 (추천)
# "never"      : 아예 묻지 않아요 (아래 sandbox 안에서만 움직이니 비교적 안전)
approval_policy = "on-request"

# 작업 폴더 안에서는 파일을 마음대로 고칠 수 있게 해요.
# 작업 폴더 밖의 파일은 못 건드려요.
sandbox_mode = "workspace-write"

# ── 2. 작업이 끝나면 휴대폰(텔레그램)으로 알림 ──────────
# setup.py를 실행하면 마지막에 내 컴퓨터에 맞는 줄을 알려줘요.
# 아래 줄 맨 앞의 # 을 지우고, 그 줄로 바꿔 넣으세요.
# 예시 (Windows):
# notify = ["C:\\Users\\내이름\\AppData\\Local\\Programs\\Python\\Python312\\python.exe", "C:\\Users\\내이름\\remote-approval\\notify.py"]
# 예시 (Mac):
# notify = ["/usr/bin/python3", "/Users/내이름/remote-approval/notify.py"]

# ── 3. 인터넷이 필요한 명령(npm install, git push 등)도 묻지 않고 하게 ──
[sandbox_workspace_write]
network_access = true
