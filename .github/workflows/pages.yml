# main 브랜치의 게임들을 GitHub Pages 웹사이트로 올려요.
#   주소/            → 끝말 배틀 (korean 폴더)
#   주소/word-train/ → 영어 Word Train (game 폴더)
# 처음 한 번은 저장소 Settings → Pages → Source 를 "GitHub Actions"로 바꿔야 해요.
name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['game/**', 'korean/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build site folder
        run: |
          mkdir -p _site/word-train
          cp -r korean/. _site/
          cp -r game/. _site/word-train/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
